services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mailgate-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mailgate
      RABBITMQ_DEFAULT_PASS: mailgate
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: mailgate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mailgate
      POSTGRES_USER: mailgate
      POSTGRES_PASSWORD: mailgate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailgate"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: mailgate-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: mailgate-keycloak
    command:
      - start-dev
      - --import-realm
      - --hostname=http://keycloak.localhost:8180
      - --hostname-strict=false
      - --http-enabled=true
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro

  api:
    build:
      context: .
      dockerfile: src/MailGate.Api/Dockerfile
    container_name: mailgate-api
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/mailgate.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: mailgate_dev
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=mailgate;Username=mailgate;Password=mailgate"
      MassTransit__Host: rabbitmq
      MassTransit__Port: "5672"
      MassTransit__VirtualHost: "/"
      MassTransit__Username: mailgate
      MassTransit__Password: mailgate
      Authentication__Keycloak__Authority: "http://keycloak.localhost:8180/realms/mailgate"
      Authentication__Keycloak__Audience: "mailgate-api"
      Authentication__Keycloak__ClientId: "mailgate-admin"
      Authentication__Keycloak__AdminRole: "mailgate-admin"
      Authentication__Keycloak__RequireHttpsMetadata: "false"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__UseTls: "false"
      Smtp__UseSsl: "false"
      Smtp__FromAddress: "noreply@mailgate.local"
      Smtp__FromName: "MailGate"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailhog:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/MailGate.Worker/Dockerfile
    container_name: mailgate-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=mailgate;Username=mailgate;Password=mailgate"
      MassTransit__Host: rabbitmq
      MassTransit__Port: "5672"
      MassTransit__VirtualHost: "/"
      MassTransit__Username: mailgate
      MassTransit__Password: mailgate
      Smtp__Host: mailhog
      Smtp__Port: "1025"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  rabbitmq_data:
  postgres_data:
